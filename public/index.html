<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кэнди.AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <header>
    <div class="avatar">🍭</div>
    <div>
      <h1>Кэнди.AI</h1>
      <p>Твой ИИ-помощник</p>
    </div>
  </header>

  <section id="chat" class="chat">
    <div class="message ai">
      Привет! Я Кэнди.AI 🍭<br>
      Спроси меня о чём-нибудь!
    </div>
  </section>

  <form id="form">
    <input
      id="input"
      placeholder="Напиши сообщение..."
      autocomplete="off"
    >
    <button>➤</button>
  </form>
</main>

<script src="app.js"></script>
</body>
    </html>
